name: rnacompass
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9.16
  - pip=23.3.1
  - pytorch=1.10.0
  - cudatoolkit=11.3
  # pytorch 1.10 links the pre-2024 MKL ABI; newer builds break `import torch`.
  - mkl=2021.4.0
  - numpy=1.26.4
  - scipy=1.10.1
  - matplotlib=3.9.4
  - scikit-learn=1.3.0
  # fairseq is installed separately; see the Installation section of README.md.
  - pip:
      - omegaconf==2.0.6
      - hydra-core==1.0.7
      - tqdm==4.66.2