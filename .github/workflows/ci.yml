name: ci

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9.16"
          cache: pip
      - run: python -m pip install --upgrade "pip==23.3.1"
      - run: python -m pip install -e ".[test]"
      - run: pytest -m "not gpu"
      - run: python scripts/check_release_tree.py
      - run: python -m build
      - run: rnacompass --help
      - run: rnacompass info --json

