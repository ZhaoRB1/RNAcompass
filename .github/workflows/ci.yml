name: ci

on:
  push:
  pull_request:

jobs:
  package-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9.16"
          cache: pip
      - run: python -m pip install --upgrade "pip==23.3.1"
      - run: python -m pip install -e .
      - run: python -m pip install "build>=1,<2"
      - run: python -m build
      - run: rnacompass --help
      - run: rnacompass info --json
      - run: rnacompass run --fasta examples/RF00001.fa --output-dir dry-run-check --dry-run

